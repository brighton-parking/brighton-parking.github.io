<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brighton Parking</title>
<meta name="description" content="Where can I park in Brighton & Hove right now?">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parking">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map of parking bays"></div>

  <header class="top">
    <div class="search-wrap">
    <form id="search" class="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Street, venue or postcode"
             aria-label="Street, venue or postcode" enterkeyhint="search" autocapitalize="words" spellcheck="false">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <ul id="q-suggest" class="suggest" hidden></ul>
    </div>
    <div class="bar">
      <ul class="legend" aria-label="Legend. Tap a colour to hide or show those bays">
        <li><button type="button" data-cat="free" aria-pressed="true"><i style="--c:var(--free)"></i><span id="legend-free">Free</span></button></li>
        <li><button type="button" data-cat="pay" aria-pressed="true"><i style="--c:var(--pay)"></i>Pay</button></li>
        <li><button type="button" data-cat="shared" aria-pressed="true"><i style="--c:var(--shared)"></i>Pay/permit</button></li>
        <li><button type="button" data-cat="permit" aria-pressed="true"><i style="--c:var(--permit)"></i>Permit only</button></li>
        <li><button type="button" data-cat="moto" aria-pressed="false"><i style="--c:var(--moto)"></i>Motorbike</button></li>
      </ul>
    </div>
    <div class="bar">
      <span id="clock" class="clock">Loading…</span>
      <button id="permit-btn" class="pill ghost" type="button">No permit</button>
      <span id="plan-chip" class="pill chip" hidden>
        <button id="plan-chip-open" type="button">Plan</button>
        <button id="plan-chip-clear" type="button" aria-label="Clear plan">✕</button>
      </span>
    </div>
  </header>

  <button id="plan-btn" class="plan-fab" type="button" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Plan a stay
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="loading" class="loading">Loading parking bays…</div>

  <section id="sheet" class="sheet" aria-live="polite" hidden>
    <button id="sheet-close" class="close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div id="sheet-body"></div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="suggest.js"></script>
<script src="app.js"></script>
<script src="planner.js"></script>
</body>
</html>
